<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад взуття</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --accent2: #53d8fb;
    --text: #eaeaea;
    --muted: #8892a4;
    --green: #2ecc71;
    --yellow: #f39c12;
    --red: #e74c3c;
    --radius: 10px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 20px 0 28px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  .search-bar {
    display: flex;
    gap: 10px;
    max-width: 720px;
    margin: 0 auto 18px;
    flex-wrap: wrap;
  }

  .search-bar input {
    flex: 1;
    padding: 12px 18px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
    min-width: 200px;
  }

  .search-bar input:focus { border-color: var(--accent2); }
  .search-bar input::placeholder { color: var(--muted); }

  .size-filter {
    display: flex;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .size-filter label { color: var(--muted); font-size: 0.85rem; }

  .size-filter select {
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .size-filter select:focus { border-color: var(--accent2); }

  .toggle-btn {
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    background: var(--surface);
    color: var(--muted);
    font-size: 0.85rem;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .toggle-btn.active {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }

  .stats-bar {
    max-width: 720px;
    margin: 0 auto 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stat strong { color: var(--accent2); }

  .results {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .shoe-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    border-left: 4px solid transparent;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: background 0.15s;
    cursor: default;
  }

  .shoe-card:hover { background: #1e2d50; }

  .shoe-card.in-stock  { border-left-color: var(--green); }
  .shoe-card.low-stock { border-left-color: var(--yellow); }
  .shoe-card.no-stock  { border-left-color: var(--red); opacity: 0.55; }

  .shoe-main { flex: 1; min-width: 0; }

  .shoe-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shoe-price {
    font-size: 0.82rem;
    color: var(--accent2);
    margin-top: 2px;
  }

  .sizes-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex: 2;
    justify-content: flex-start;
  }

  .size-tag {
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 0.82rem;
    font-weight: 600;
    transition: background 0.1s;
  }

  .size-tag.highlight {
    background: var(--accent);
    color: white;
  }

  .count-badge {
    background: var(--card);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

  .no-stock-label {
    font-size: 0.78rem;
    color: var(--red);
    margin-top: 3px;
  }

  @media (max-width: 600px) {
    .shoe-card { flex-direction: column; align-items: flex-start; gap: 10px; }
    .sizes-wrap { width: 100%; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>

// Merge duplicate names, combine sizes
const merged = {};
for (const item of raw) {
  const key = `${item.price}||${item.name.trim()}`;
  if (!merged[key]) {
    merged[key] = { price: item.price, name: item.name.trim(), sizes: [] };
  }
  merged[key].sizes.push(...item.sizes);
}

const shoes = Object.values(merged);

// Count sizes per item (unique sorted sizes with counts)
function buildSizeCounts(sizes) {
  const counts = {};
  for (const s of sizes) {
    counts[s] = (counts[s] || 0) + 1;
  }
  return Object.entries(counts)
    .map(([size, count]) => ({ size: parseInt(size), count }))
    .sort((a, b) => a.size - b.size);
}

// Collect all unique sizes for filter
const allSizes = [...new Set(raw.flatMap(s => s.sizes))].sort((a,b)=>a-b);
const sizeSelect = document.getElementById('sizeSelect');
for (const s of allSizes) {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = `${s}`;
  sizeSelect.appendChild(opt);
}

let showNoStock = true;

function toggleNoStock() {
  showNoStock = !showNoStock;
  const btn = document.getElementById('noStockBtn');
  btn.classList.toggle('active', !showNoStock);
  btn.textContent = showNoStock ? 'Сховати без залишку' : 'Показати без залишку';
  render();
}

function normalize(str) {
  return str.toLowerCase().replace(/\s+/g, '');
}

function render() {
  const query = normalize(document.getElementById('searchInput').value);
  const filterSize = sizeSelect.value ? parseInt(sizeSelect.value) : null;

  let results = shoes.filter(shoe => {
    const nameMatch = !query || normalize(shoe.name).includes(query);
    const sizeMatch = !filterSize || shoe.sizes.includes(filterSize);
    const stockMatch = showNoStock || shoe.sizes.length > 0;
    return nameMatch && sizeMatch && stockMatch;
  });

  // Sort: in-stock first, then alphabetically
  results.sort((a, b) => {
    if (b.sizes.length !== a.sizes.length) return b.sizes.length - a.sizes.length;
    return a.name.localeCompare(b.name, 'uk');
  });

  const totalItems = results.reduce((sum, s) => sum + s.sizes.length, 0);
  document.getElementById('countFound').textContent = results.length;
  document.getElementById('countTotal').textContent = totalItems;

  const container = document.getElementById('results');
  container.innerHTML = '';

  if (results.length === 0) {
    container.innerHTML = `<div class="empty"><span>🔍</span>Нічого не знайдено.<br>Спробуйте інший запит.</div>`;
    return;
  }

  for (const shoe of results) {
    const sizeCounts = buildSizeCounts(shoe.sizes);
    const totalCount = shoe.sizes.length;
    let stockClass = 'in-stock';
    if (totalCount === 0) stockClass = 'no-stock';
    else if (totalCount <= 2) stockClass = 'low-stock';

    const card = document.createElement('div');
    card.className = `shoe-card ${stockClass}`;

    const sizesHtml = sizeCounts.map(({ size, count }) => {
      const hl = filterSize && filterSize === size ? 'highlight' : '';
      return `<span class="size-tag ${hl}">${size}${count > 1 ? ' ×' + count : ''}</span>`;
    }).join('');

    const noStockLabel = totalCount === 0 ? '<div class="no-stock-label">Немає в наявності</div>' : '';

    card.innerHTML = `
      <div class="shoe-main">
        <div class="shoe-name" title="${shoe.name}">${shoe.name}</div>
        <div class="shoe-price">${shoe.price.toLocaleString('uk-UA')} грн</div>
        ${noStockLabel}
      </div>
      <div class="sizes-wrap">${sizesHtml || '<span style="color:var(--muted);font-size:.82rem">—</span>'}</div>
      <div class="count-badge">${totalCount} пар</div>
    `;
    container.appendChild(card);
  }
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sizeSelect').addEventListener('change', render);

render();
</script>
